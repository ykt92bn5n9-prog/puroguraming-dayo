<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ドリトル環境（裏コマンド搭載版）</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; font-family: sans-serif;
            background-color: #f0f0f0; display: flex; flex-direction: column; height: 100vh;
        }
        #menu-bar {
            background-color: #ffffff; border-bottom: 1px solid #ccc;
            padding: 5px 10px; display: flex; align-items: center; gap: 10px;
        }
        #menu-bar button {
            padding: 4px 12px; font-size: 14px; background-color: #fff;
            border: 1px solid #bbb; border-radius: 3px; cursor: pointer;
        }
        #menu-bar button:hover { background-color: #eee; }
        #server-status { font-size: 13px; color: #333; margin-left: 10px; font-weight: bold; }

        #main-container { display: flex; flex: 1; overflow: hidden; }
        #editor-container { flex: 1; background-color: #ffffff; border-right: 2px solid #ccc; display: flex; }
        #line-number {
            width: 30px; background-color: #e0e0e0; border-right: 1px solid #ccc;
            text-align: center; padding-top: 10px; font-family: monospace; font-size: 16px; color: #666; user-select: none;
        }
        #code-input {
            flex: 1; border: none; outline: none; padding: 10px;
            font-size: 16px; font-family: monospace; resize: none; line-height: 1.5;
        }
        
        /* 右側：実行ステージ */
        #stage {
            width: 50%; background-color: #ffffff; position: relative; padding: 20px;
            display: flex; flex-direction: column; gap: 12px; align-items: flex-start;
        }
        
        /* 最初のメッセージ表示用のスタイル */
        #normal-text-display {
            font-size: 30px; font-weight: bold; color: black; margin-bottom: 10px;
        }

        .dr-label { font-size: 12px; color: #666; margin-bottom: -8px; }
        .dr-button { padding: 4px 15px; font-size: 14px; cursor: pointer; }
        .dr-field { padding: 6px; font-size: 14px; border: 1px solid #ccc; border-radius: 3px; width: 250px; }
        
        /* 自動広告スタイル */
        #ad-container { width: 100%; display: flex; justify-content: center; margin-bottom: 5px; }
        .dr-ad {
            width: 100%; max-width: 400px; height: 50px; background: linear-gradient(45deg, #ff9a9e, #fecfef);
            border: 2px dashed #ff4b72; border-radius: 5px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #ff2a55; font-size: 13px; cursor: pointer; position: relative;
        }
        .dr-ad::before { content: "【PR】"; position: absolute; top: 2px; left: 5px; font-size: 9px; color: #ff4b72; background: white; padding: 0 3px; border-radius: 2px; }
    </style>
</head>
<body>

    <div id="menu-bar">
        <button onclick="runDolittle()">実行</button>
        <button onclick="alert('保存機能')">保存</button>
        <button onclick="alert('読込機能')">読込</button>
        <label style="font-size: 14px; cursor: pointer;"><input type="checkbox" id="server-checkbox" onchange="toggleServer(this)"> server</label>
        <span id="server-status">オフライン</span>
        <span style="font-size: 13px; color: #666; margin-left: auto;">version:2026.secret(alpha)</span>
    </div>

    <div id="main-container">
        <div id="editor-container">
            <div id="line-number">1</div>
            <textarea id="code-input" placeholder="プログラムを入力してね"></textarea>
        </div>
        <div id="stage"></div>
    </div>

    <script>
        const stage = document.getElementById("stage");
        let objects = {};
        let lastReceivedMsg = "";
        let peer = null;
        let connection = null;
        let onReceiveBlock = ""; 

        // 最初は空っぽ
        document.getElementById("code-input").value = "";

        function toggleServer(checkbox) {
            const statusText = document.getElementById("server-status");
            if (checkbox.checked) {
                statusText.innerText = "起動中...";
                peer = new Peer();
                peer.on('open', (id) => { statusText.innerHTML = `起動中（ID: <b style="color:blue;">${id}</b>）`; });
                peer.on('connection', (conn) => {
                    connection = conn;
                    statusText.innerText = "通信接続完了";
                    setupConnection();
                });
            } else {
                if (peer) peer.destroy();
                statusText.innerText = "オフライン";
            }
        }

        function setupConnection() {
            if (!connection) return;
            connection.on('data', (data) => {
                lastReceivedMsg = data;
                if (onReceiveBlock) {
                    executeBlock(onReceiveBlock);
                }
            });
        }

        function insertAutoAd() {
            const adContainer = document.createElement("div");
            adContainer.id = "ad-container";
            const adBox = document.createElement("div");
            adBox.className = "dr-ad";
            const adTexts = ["今すぐクリック！最強のプログラミング塾", "【限定】ドリトルで稼ぐ方法！？", "5分で分かる！JavaScript超入門"];
            adBox.innerText = adTexts[Math.floor(Math.random() * adTexts.length)];
            adBox.onclick = () => { window.open("https://github.com", "_blank"); };
            adContainer.appendChild(adBox);
            stage.appendChild(adContainer);
        }

        // 実行ボタンが押された時の処理
        function runDolittle() {
            stage.innerHTML = ""; 
            objects = {};
            onReceiveBlock = "";
            insertAutoAd(); 

            let rawCode = document.getElementById("code-input").value.trim();

            // 🌟 裏コマンドの判定
            // 「メッセージよ、一宮中学校、喋れ」と打たれたら、普通の文字表示をしつつチャットコードも裏で動かす
            let isSecretTriggered = false;
            if (rawCode.replace(/。/g, "") === "メッセージよ、一宮中学校、喋れ") {
                isSecretTriggered = true;
                // 通常の文字表示用の要素をステージに作る
                const normalText = document.createElement("div");
                normalText.id = "normal-text-display";
                normalText.innerText = "一宮中学校";
                stage.appendChild(normalText);

                // 裏でチャット用の正式なドリトルコードに置き換えて解析させる！
                rawCode = 
`サーバー！“localhost” 接続。
送信ボタン＝ボタン！“送信” 作る。
入力欄＝フィールド！ 作る。
表示欄＝フィールド！ 作る。
送信ボタン：動作＝「
　メッセージ＝入力欄！ 読む。
　サーバー！（メッセージ）書き込む。
」。
受信イベント＝サーバー！「
　受信メッセージ＝サーバー！“msg” 読む。
　表示欄！（受信メッセージ）書く。
」。`;
            }

            const lines = rawCode.replace(/[\n\r]/g, "").split("。");
            let actionBlock = "";
            let insideBlock = false;
            let actionTarget = "";
            let blockType = ""; 

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.includes("：動作＝「")) {
                    insideBlock = true;
                    blockType = "action";
                    actionTarget = trimmed.split("：")[0];
                    return;
                }

                if (trimmed.includes("受信イベント＝サーバー！「")) {
                    insideBlock = true;
                    blockType = "receive";
                    return;
                }

                if (insideBlock && trimmed.includes("」")) {
                    insideBlock = false;
                    if (blockType === "action") {
                        const targetBtn = objects[actionTarget];
                        if (targetBtn) {
                            const codeInside = actionBlock;
                            targetBtn.onclick = () => { executeBlock(codeInside); };
                        }
                    } else if (blockType === "receive") {
                        onReceiveBlock = actionBlock; 
                    }
                    actionBlock = "";
                    return;
                }

                if (insideBlock) {
                    actionBlock += trimmed + "。";
                    return;
                }

                executeLine(trimmed);
            });

            // 裏コマンドが発動していない、かつ普通のメッセージ命令だった場合の処理
            if (!isSecretTriggered && rawCode.includes("、喋れ")) {
                const tokens = rawCode.replace(/。/g, "").split("、");
                if (tokens[0] === "メッセージよ" && tokens[2] === "喋れ") {
                    const normalText = document.createElement("div");
                    normalText.id = "normal-text-display";
                    normalText.innerText = tokens[1];
                    stage.appendChild(normalText);
                }
            }
        }

        function executeLine(line) {
            let s = line.replace(/！/g, "!").replace(/“/g, '"').replace(/”/g, '"').replace(/＝/g, "=");

            if (s.startsWith("サーバー!")) {
                const id = s.match(/"([^"]+)"/);
                if (id && id[1] !== "localhost") {
                    document.getElementById("server-status").innerText = "接続中...";
                    peer = new Peer();
                    peer.on('open', () => {
                        connection = peer.connect(id[1]);
                        connection.on('open', () => {
                            document.getElementById("server-status").innerText = "通信接続完了";
                            setupConnection();
                        });
                    });
                }
                return;
            }

            if (s.includes("=ボタン!\"") && s.includes("作る")) {
                const varName = s.split("=")[0].trim();
                const btnText = s.match(/"([^"]+)"/)[1];
                const btn = document.createElement("button");
                btn.className = "dr-button";
                btn.innerText = btnText;
                stage.appendChild(btn);
                objects[varName] = btn;
                return;
            }

            if (s.includes("=フィールド!") && s.includes("作る")) {
                const varName = s.split("=")[0].trim();
                const label = document.createElement("div");
                label.className = "dr-label";
                label.innerText = `【${varName}】`;
                stage.appendChild(label);

                const input = document.createElement("input");
                input.type = "text";
                input.className = "dr-field";
                stage.appendChild(input);
                objects[varName] = input;
                return;
            }
        }

        function executeBlock(blockCode) {
            const lines = blockCode.split("。");
            lines.forEach(line => {
                let s = line.trim().replace(/！/g, "!").replace(/“/g, '"').replace(/”/g, '"').replace(/＝/g, "=");
                if (!s) return;

                if (s.includes("=フィールド!読む") || (s.includes("=") && s.includes("!読む"))) {
                    const varName = s.split("=")[0].trim();      
                    const targetField = s.split("=")[1].split("!")[0].trim(); 
                    const element = objects[targetField];
                    if (element) { objects[varName] = element.value; }
                    return;
                }

                if (s.includes("サーバー!（") && s.includes("）書き込む")) { s = s.replace(/（/g, "(").replace(/）/g, ")"); }
                if (s.includes("サーバー!(") && s.includes(")書き込む")) {
                    const varName = s.match(/\(([^)]+)\)/)[1]; 
                    const value = objects[varName];
                    if (connection && connection.open && value !== undefined) { connection.send(value); }
                    return;
                }

                if (s.includes("=サーバー!\"msg\"読む")) {
                    const varName = s.split("=")[0].trim();
